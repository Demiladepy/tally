[package]
name = "tally-wasm"
version = "0.1.0"
description = "Tally verifier and ballot sealing for the browser (plain C ABI, JSON in/out)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tally-crypto = { path = "../tally-crypto" }
tally-zcash = { path = "../tally-zcash" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
rand_chacha = "0.3"
# Scan-to-pay deposit codes, drawn here so the page loads no third-party code.
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
zcash_address = "0.14"
zcash_protocol = "0.11"
